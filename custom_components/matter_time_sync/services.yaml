sync_time:
  name: Sync time
  description: Synchronize time and timezone on a Matter device using the global integration settings.
  fields:
    node_id:
      name: Node ID
      description: Matter device node ID (required if device is not selected)
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    device_id:
      name: Device
      description: Select Matter device (use this instead of manually entering node_id)
      required: false
      advanced: true
      example: "abc123"
      selector:
        device:
          integration: matter
    endpoint:
      name: Endpoint
      description: Matter device endpoint ID
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
